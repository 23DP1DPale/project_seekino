services:
  mysql:
    image: mysql:8.4
    container_name: seekino-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: seekino
      MYSQL_USER: seekino
      MYSQL_PASSWORD: seekino
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -proot --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mysql_data:
